{% extends 'base.html' %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
    <h3 class="fw-bold mb-0"><i class="bi bi-people me-1"></i> Панель оператора</h3>
    <a href="/logout" class="btn btn-outline-danger btn-sm">Выход</a>
</div>
<div class="card p-3 mb-4 shadow-sm">
    <div class="row g-2 align-items-end">
        <div class="col-md-3">
            <label class="form-label small fw-semibold">Статус</label>
            <select class="form-select" id="opFilterStatus">
                <option value="all">Все</option>
                <option value="new">Новые</option>
                <option value="progress">В работе</option>
                <option value="done">Завершённые</option>
                <option value="reject">Отклонённые</option>
            </select>
        </div>
        <div class="col-md-3">
            <label class="form-label small fw-semibold">Категория</label>
            <select class="form-select" id="opFilterCat">
                <option value="all">Все</option>
                <option value="ЖКХ">ЖКХ</option>
                <option value="Транспорт">Транспорт</option>
                <option value="Социальная сфера">Социальная сфера</option>
                <option value="Административные вопросы">Административные</option>
            </select>
        </div>
        <div class="col-md-4">
            <label class="form-label small fw-semibold">Поиск</label>
            <input type="text" class="form-control" id="opSearch" placeholder="Код или тема...">
        </div>
        <div class="col-md-2"><button class="btn btn-outline-primary w-100" onclick="appOp.renderTable()">Применить</button></div>
    </div>
</div>
<div class="table-responsive bg-white rounded shadow-sm">
    <table class="table table-hover mb-0" id="opTable">
        <thead class="table-light">
            <tr><th>Код</th><th>Тип</th><th>Тема</th><th>Статус</th><th>Дата</th><th class="text-end">Действия</th></tr>
        </thead>
        <tbody id="opTableBody"></tbody>
    </table>
</div>

<div class="modal fade" id="statusModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Изменение статуса</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="smId">
                <div class="mb-3">
                    <label class="form-label">Новый статус</label>
                    <select class="form-select" id="smNew">
                        <option value="progress">В работе</option>
                        <option value="done">Завершено</option>
                        <option value="reject">Отклонено</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label">Комментарий</label>
                    <textarea class="form-control" id="smComment" rows="2"></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Отмена</button>
                <button type="button" class="btn btn-primary" onclick="appOp.saveStatus()">Сохранить</button>
            </div>
        </div>
    </div>
</div>
{% endblock %}
