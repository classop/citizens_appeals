{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="text-center mb-4">
            <h1 class="fw-bold">Электронная приёмная</h1>
            <p class="text-muted">Подайте жалобу или предложение. Регистрация не требуется.</p>
        </div>
        <div class="card p-4 shadow-sm">
            <form id="appealForm" novalidate>
                {{ form.hidden_tag() }}
                <div class="row g-3 mb-3">
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Тип обращения <span class="text-danger">*</span></label>
                        <select class="form-select" name="appeal_type" required>
                            <option value="" disabled selected>Выберите тип...</option>
                            <option value="Жалоба">Жалоба</option>
                            <option value="Предложение">Предложение</option>
                            <option value="Заявление">Заявление</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Категория <span class="text-danger">*</span></label>
                        <select class="form-select" name="category" required>
                            <option value="" disabled selected>Выберите категорию...</option>
                            <option value="ЖКХ">ЖКХ</option>
                            <option value="Транспорт">Транспорт</option>
                            <option value="Социальная сфера">Социальная сфера</option>
                            <option value="Административные вопросы">Административные вопросы</option>
                            <option value="Другое">Другое</option>
                        </select>
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Тема <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" name="title" maxlength="150" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Подробное описание <span class="text-danger">*</span></label>
                    <textarea class="form-control" name="description" rows="4" maxlength="2000" required></textarea>
                    <small class="text-muted d-block text-end mt-1" id="charCount">0 / 2000</small>
                </div>
                <div class="mb-4">
                    <label class="form-label">Email для связи (необязательно)</label>
                    <input type="email" class="form-control" name="contact">
                </div>
                <button type="submit" class="btn btn-primary w-100" id="btnSubmit"><i class="bi bi-send me-1"></i> Отправить обращение</button>
            </form>
        </div>
    </div>
</div>

<div class="modal fade" id="successModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content p-4 text-center">
            <div class="mb-2 text-success"><i class="bi bi-check-circle-fill fs-1"></i></div>
            <h4 class="fw-bold">Обращение успешно зарегистрировано</h4>
            <p class="text-muted mb-3">Сохраните код для отслеживания статуса</p>
            <div class="bg-light rounded p-3 mb-3"><code class="fs-3 fw-bold" id="modalCode"></code></div>
            <div class="d-flex gap-2 justify-content-center">
                <a href="/track" class="btn btn-primary">Отследить статус</a>
                <button class="btn btn-outline-secondary" data-bs-dismiss="modal">Закрыть</button>
            </div>
        </div>
    </div>
</div>
{% endblock %}
