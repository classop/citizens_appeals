{% extends 'base.html' %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
    <h3 class="fw-bold mb-0"><i class="bi bi-graph-up-arrow me-1"></i> Панель администратора</h3>
    <div class="btn-group">
        <a href="/export/csv" class="btn btn-outline-success btn-sm"><i class="bi bi-file-earmark-spreadsheet me-1"></i> Экспорт CSV</a>
        <a href="/logout" class="btn btn-outline-danger btn-sm">Выход</a>
    </div>
</div>

<div class="row g-4 mb-4">
    <div class="col-md-6">
        <div class="card p-3 shadow-sm h-100">
            <div class="position-relative" style="height: 250px; width: 100%;">
                <canvas id="chartStatus"></canvas>
            </div>
            <p class="text-center text-muted small mt-2 mb-0">Распределение по статусам</p>
        </div>
    </div>
    <div class="col-md-6">
        <div class="card p-3 shadow-sm h-100">
            <div class="position-relative" style="height: 250px; width: 100%;">
                <canvas id="chartCat"></canvas>
            </div>
            <p class="text-center text-muted small mt-2 mb-0">Обращения по категориям</p>
        </div>
    </div>
</div>

<div class="row g-4">
    <div class="col-md-6">
        <div class="card p-3 shadow-sm h-100">
            <h5 class="fw-bold mb-3"><i class="bi bi-journal-text me-1"></i> Журнал действий</h5>
            <div class="overflow-auto" style="max-height: 320px;" id="adminLogs"></div>
        </div>
    </div>
    <div class="col-md-6">
        <div class="card p-3 shadow-sm h-100">
            <h5 class="fw-bold mb-3"><i class="bi bi-people me-1"></i> Управление сотрудниками</h5>
            <div class="table-responsive">
                <table class="table table-sm align-middle mb-3">
                    <thead class="bg-light"><tr><th>Логин</th><th>Роль</th><th>Создан</th><th></th></tr></thead>
                    <tbody id="adminUsers"></tbody>
                </table>
            </div>
            <form id="addUserForm" class="row g-2 align-items-end mt-3 pt-3 border-top">
                <div class="col-4">
                    <label class="form-label small mb-1">Логин</label>
                    <input type="text" class="form-control form-control-sm" id="auLogin" placeholder="ivanov_a" required>
                </div>
                <div class="col-3">
                    <label class="form-label small mb-1">Роль</label>
                    <select class="form-select form-select-sm" id="auRole">
                        <option value="operator">Оператор</option>
                        <option value="admin">Администратор</option>
                    </select>
                </div>
                <div class="col-3">
                    <label class="form-label small mb-1">Пароль</label>
                    <input type="password" class="form-control form-control-sm" id="auPass" placeholder="••••••" required>
                </div>
                <div class="col-2">
                    <button type="submit" class="btn btn-primary-app btn-sm w-100"><i class="bi bi-plus-lg"></i></button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
